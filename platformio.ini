; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Bu projede en cok mudahale edilen yerler:
; - kart / port degisimi -> board, upload_port, monitor_port
; - hangi firmware derlenecek -> env secimi
; - sadece GPIO testi -> [env:esp32-s3-gpio-test]
; - GIZLI BILGILER (Wi-Fi, Telegram, admin) -> include/secrets.h
;   (Bu dosya .gitignore'da, GitHub'a gitmez. Sablon: include/secrets.example.h)

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions/evse_ota.csv
extra_scripts =
	pre:scripts/set_version_flag.py
	post:scripts/factory_usb_finalize.py
board_build.sdkconfig = sdkconfig.defaults
custom_firmware_name = uzaktanotali.bin
; Ana firmware env'i. Normal kullanimda yuklenen hedef budur.
; Not: COM4 bu makinede Bluetooth seri portu olarak gorunuyor.
; ESP32-S3 kart su an USB-Enhanced-SERIAL CH343 olarak COM7'de.
monitor_port = COM13
upload_port = COM13
monitor_speed = 115200
build_src_filter =
	+<*>
	-<gpio_test_main.cpp>
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_USB_MODE=0
	-DAPP_LOG_LEVEL=3
	-include "include/secrets.h"
upload_speed = 921600
lib_deps = 
	olikraus/U8g2 @ ^2.36.0
	openenergymonitor/EmonLib@^1.1.0
	bblanchon/ArduinoJson @ ^6.21.3
	esp32async/ESPAsyncWebServer @ 3.10.3

[env:esp32-s3-devkitc-1-ota]
extends = env:esp32-s3-devkitc-1
; Ayni firmware'i kablosuz OTA ile yuklemek icin.
upload_protocol = espota
upload_port = 192.168.1.200
; EVSE_OTA_PASSWORD bos degilse:
; upload_flags =
;   --auth=sifreyi_buraya_yaz

[env:esp32-s3-gpio-test]
extends = env:esp32-s3-devkitc-1
; Ana uygulamayi derlemez. Sadece src/gpio_test_main.cpp icindeki test kodunu yukler.
build_src_filter =
  -<*>
  +<gpio_test_main.cpp>